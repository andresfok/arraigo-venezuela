<details><summary>¿Por qué el Tote Marea es más pesado que otros?</summary><p>Porque lleva más material. El grande pesa 1,3 kg y el mediano 820 g, más que la mayoría de los bolsos de este tipo del mismo tamaño. Eso se traduce en paredes más gruesas, un bolso que mantiene su forma y un acabado más suave.</p></details>
