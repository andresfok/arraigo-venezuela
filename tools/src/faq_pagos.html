<details><summary>¿Qué métodos de pago aceptan?</summary><p>Pago Móvil, Zelle, USDT (Binance) y efectivo en dólares. Cada producto tiene dos precios, ambos con IVA: el precio en divisas, si pagas en efectivo, Zelle o USDT, y el precio en bolívares, que pagas por Pago Móvil al equivalente de la tasa BCV del día.</p></details>
